<style>

p{font:500 .98rem/1.55 "DM Sans",sans-serif;margin-bottom:12px}sup{font-size:.6em}

.sl.on u.w{animation:slam .6s cubic-bezier(.2,.9,.3,1.25) calc(var(--i)*55ms + 200ms) both,hl2 .6s ease calc(var(--i)*55ms + 700ms) forwards}
.sl.on .a{animation:rise .6s ease calc(var(--d,0)*1ms + 650ms) both}

.pw{position:relative;display:inline-block;--r:-3deg;margin:12px 0 22px;opacity:0}.pw img{display:block;height:29vh;max-height:290px;width:auto;border:6px solid #fffaf0;box-shadow:4px 6px 0 rgba(26,11,46,.3)}.pw::before{content:"";position:absolute;top:-9px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#a78bfa 14% 42%,#4c1d95 75%);box-shadow:2px 4px 3px rgba(0,0,0,.35);z-index:2}

.links{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}

/* jogo interativo */
.gh{display:flex;justify-content:space-between;font:500 .7rem "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase}

.dk{position:relative;height:250px;margin-bottom:16px}

.stp{position:absolute;top:12px;font:400 1.3rem Anton,sans-serif;text-transform:uppercase;border:3px solid;border-radius:8px;padding:1px 10px;opacity:0;transition:opacity .15s}
.stp.l{left:12px;color:#15803d;transform:rotate(-10deg)}.stp.r{right:12px;color:#be123c;transform:rotate(10deg)}
.cd2.L .stp.l,.cd2.R .stp.r{opacity:1}.cd2.L{background:#e4f7ea}.cd2.R{background:#fde4e8}
.cd2.hint{animation:nudge 1.4s .9s 2}
.fbk{position:relative;background:var(--card);color:#1a0b2e;border:2px solid var(--fg);border-radius:14px;padding:16px;box-shadow:4px 4px 0 var(--fg);animation:pop .35s cubic-bezier(.3,1.4,.5,1);overflow:hidden}

.stamp small{display:block;font:500 .6rem "DM Mono",monospace;margin:0;letter-spacing:.06em}
.vd{display:block;margin:12px 0 4px;font-size:.9rem}.fbk p{font-size:.84rem;margin:4px 0 12px}
.chip{display:inline-block;font:700 .66rem "DM Mono",monospace;text-transform:uppercase;background:var(--hl);color:var(--hlc);padding:4px 8px;border-radius:6px;margin:0 8px 8px 0}
.cp{position:absolute;left:50%;top:40px;width:8px;height:12px;background:var(--c);pointer-events:none;animation:fly .95s ease-out forwards}
.score{font:400 5.5rem/1 Anton,sans-serif;color:#6d28d9;margin:10px 0 4px}
.rvi{border-top:2px solid #1a0b2e;padding:10px 0;font-size:.8rem;line-height:1.45}.rvi b{display:block;font:500 .68rem "DM Mono",monospace;text-transform:uppercase;color:#6d28d9}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes stampIn{0%{opacity:0;transform:scale(2.6) rotate(-14deg)}60%{opacity:1;transform:scale(.94) rotate(-5deg)}100%{opacity:1;transform:scale(1) rotate(-5deg)}}

@media(prefers-reduced-motion:reduce){.fbk,.stamp,.cd2.hint,.sk{animation:none!important}.cp{display:none}}

</style></head><body>

["Freud","Melancolia e identificação narcísica","Sem espaço para o luto, a energia afetiva desligada do outro volta sobre o próprio ego. A imagem do parceiro é incorporada e a instância crítica passa a atacar o eu com a mesma severidade do agressor. É a ideia de que a sombra do objeto caiu sobre o ego, e explica por que depressão e autopunição persistem depois do término."],
["Ferenczi","Identificação com o agressor","Diante do terror e da assimetria de poder, o psiquismo não tem como reagir. Para sobreviver, absorve a culpa, a lógica e a hostilidade do violador e se divide internamente. O ódio nascido na convivência passa a se refratar no mundo interno."],

const TB={fases:[["1 · Segurança","O corpo se acalma primeiro","Moradia protetora, afastamento concreto das ameaças e rotina material estável. Enquanto corpo e mente seguem em hipervigilância, elaborar a dor a fundo é ineficaz ou até retraumatizante."],["2 · Lembrança e luto","A história vira passado","Transformar fragmentos dolorosos em narrativa coerente, nomear as violências sutis e explícitas, desfazer a culpa introjetada e chorar as perdas. A história deixa de ser um fantasma no presente."],["3 · Reconexão","Autoria da própria vida","Voltar a criar laços e projetar o futuro. Aparece o crescimento pós-traumático: a vivência vira saber, arte, militância ou rede de acolhimento, como na narrativa de Stephanie Land em Maid."]],lentes:T};
const tabs=g=>`<div class="chips a" data-g="${g}">${TB[g].map((t,i)=>`<button data-i="${i}" aria-selected="${!i}">${t[0].split(" · ")[0]=="1"||g=="fases"?t[0]:t[0]}</button>`).join("")}</div><div class="pn a" id="pn-${g}"></div>`;
const S=[
{t:"purple",k:"TCC · Psicologia · 2026",h:"Rompendo [[o ciclo]]",p:"Sair da relação não apaga o que ela deixou. Esta é uma leitura da psicologia sobre por que ficamos, por que ainda dói e como a gente se reconstrói.",n:"deslize → ou toque em próximo slide",btn:"Começar"},
{t:"paper",k:"A premissa",h:"O fim da convivência não é o [[fim do impacto]].",p:"Depois da separação, a agressão pode continuar dentro da própria mente: na culpa, na autocrítica, na sensação de ter se perdido de si.",n:"“O afastamento físico representa apenas o limiar de um percurso.”"},
{t:"lilac",k:"Teoria do apego",h:"Por que a gente [[fica]]?",p:"Não é falta de caráter nem passividade. Modelos formados nas primeiras relações definem o quanto acreditamos valer e o quanto esperamos do outro.<sup>1</sup>",x:`<div class="g2 a"><div class="cd"><b>Seguro</b>Confia em si e no outro</div><div class="cd hl"><b>Preocupado</b>Duvida do próprio valor</div><div class="cd"><b>Desdenhoso</b>Valoriza-se e desconfia do outro</div><div class="cd hl"><b>Temeroso</b>Desconfia de si e do outro</div></div><small class="a"><sup>1</sup> Bartholomew e Horowitz. Em destaque, os estilos com self negativo, associados à permanência no abuso.</small>`},
{t:"ink",k:"Vínculo traumático",h:"A violência não soa ~~estranha~~. Soa [[coerente]].",p:"Quando o desvalor já mora dentro, o sofrimento ganha ares de familiaridade, a culpa é internalizada e os recursos para reconhecer o abuso ficam bloqueados."},
{t:"paper",k:"Psicanálise",h:"Depois do fim, a violência [[muda de lugar]].",p:"Três autores ajudam a entender o que se passa no mundo interno após a ruptura.",x:tabs("lentes")},
{t:"purple",k:"Falso self e verdadeiro self",h:"Submissão como [[sobrevivência]].",p:"O que parece apagamento é uma blindagem: o verdadeiro self se recolhe em exílio silencioso para não se desintegrar.",x:`<div class="g2 a"><div class="cd"><b>Falso self</b><ul><li>Cede à lógica do agressor</li><li>Agrada, cala, se adapta</li><li>Perde agência</li></ul></div><div class="cd"><b>Self verdadeiro</b><ul><li>Sente, deseja, cria</li><li>Esteve preservado</li><li>Reemerge com apoio</li></ul></div></div>`,n:"reemergir pede um ambiente firme, previsível e não intrusivo: terapia, rede de apoio, vínculo seguro"},
{t:"lilac",k:"Modelo de Judith Herman",h:"Reconstruir tem [[três tempos]].",p:"Cada fase tem pré-requisitos que não podem ser pulados nem abreviados.",x:tabs("fases")},
{t:"paper",k:"Perspectiva de gênero",h:"Não é só [[individual]].",p:"A dominação encontra solo fértil numa cultura que forma mulheres para a renúncia, o cuidado e o amor como eixo da identidade.",x:`<div class="st a"><div class="cd"><b>“Por que ela não saiu antes?”</b><p>Culpa, submissão e perda de agência não são fragilidades privadas. Ligam-se a imperativos culturais que põem o vínculo acima da própria integridade.</p></div><div class="cd"><b>“Terminou, então acabou.”</b><p>A violência pode persistir como funcionamento melancólico: depressão, estresse pós-traumático e autopunição.</p></div><div class="cd"><b>“Um dia volta a ser quem era.”</b><p>O trauma altera a experiência. O que se constrói é uma identidade nova, transformada.</p></div></div>`},
{t:"purple",k:"Considerações finais",h:"O que a pesquisa [[conclui]].",p:"A hipótese se confirma: o rompimento do ciclo não se limita ao fim da relação. Ele inaugura um processo de elaboração do trauma e reintegração do self.",x:`<ol class="ls a"><li>Raízes desenvolvimentais</li><li>A violência muda de endereço</li><li>O self verdadeiro resiste</li><li>Etapas que não se abreviam</li><li>Da dor privada ao ato criativo</li><li>Uma lacuna que a pesquisa aponta</li></ol>`},
{t:"ink",k:"Se precisar de ajuda",h:"Você ou alguém que você conhece [[vive violência]]?",x:`<div class="big a">180</div><p class="a">Central de Atendimento à Mulher, gratuito e 24 horas. Em risco imediato, ligue 190.</p><div class="links a"><a class="bt" href="tel:180">Ligar 180</a><a class="bt" href="tel:190">Ligar 190</a></div>`},
{t:"lilac",k:"Jogo · É ou não é?",h:"Você sabe [[identificar]]?",x:`<div id="gm" class="a"></div><small class="a">Jogo educativo, não substitui avaliação profissional.</small>`},
{t:"purple",k:"Na tela",h:"Sinais que o cinema [[já mostrou]].",p:"Filmes e séries que ajudam a visualizar conceitos e sinais da violência doméstica.",n:"alguns títulos têm cenas fortes e podem ser gatilho. cuide de você."},

const $=id=>document.getElementById(id),app=$("app"),stage=$("stage"),nx=$("nx"),pv=$("pv"),bars=$("bars");
function H(s){let i=0;return s.replace(/\[\[(.+?)\]\]([.,;:?!]*)|~~(.+?)~~([.,;:?!]*)|(\S+)/g,(m,a,pa,b,pb,d)=>{const v=`style="--i:${i++}"`;return a?`<mark class="w" ${v}>${a}</mark>${pa} `:b?`<s class="w" ${v}>${b}</s>${pb} `:`<span class="w" ${v}>${d}</span> `})}
stage.innerHTML=S.map((s,i)=>`<section class="sl t-${s.t}" aria-label="Slide ${i+1} de ${S.length}" aria-hidden="true"><div class="in">${s.po?`<div class="pw"><img src="${s.po}" alt="${s.alt}"></div>`:""}${s.lg?`<img class="lg a" src="${AV}" alt="Logo Rompa o Ciclo">`:""}<div class="k a">${s.k}</div><h2${s.sm?' class="sm"':""}>${H(s.h)}</h2>${s.m?`<div class="meta a">${s.m}</div>`:""}${s.p?`<p class="a">${s.p}</p>`:""}${s.x||""}${s.n?`<div class="nt">${s.n}</div>`:""}</div></section>`).join("");
const sl=[...stage.children];
sl.forEach(e=>e.querySelectorAll(".in>.a,.in>.nt,.in>.pw").forEach((x,i)=>x.style.setProperty("--d",i*110)));
bars.innerHTML=S.map((_,i)=>`<i data-i="${i}"></i>`).join("");
let cur=-1;const pad=n=>String(n).padStart(2,"0");
function go(i){i=Math.max(0,Math.min(S.length-1,i));if(i==cur)return;cur=i;
sl.forEach((e,j)=>{e.classList.toggle("on",j==i);e.classList.toggle("past",j<i);e.setAttribute("aria-hidden",j!=i)});sl[i].scrollTop=0;
app.className="app t-"+S[i].t;bars.querySelectorAll("i").forEach((b,j)=>b.classList.toggle("on",j<=i));
$("cn").textContent="SLIDE "+pad(i+1)+"/"+S.length;$("nm").textContent=S[i].k;$("lv").textContent="Slide "+(i+1)+" de "+S.length+": "+S[i].k;
pv.hidden=i==0;nx.textContent=i==0?(S[0].btn||"Começar"):i==S.length-1?"Voltar ao início":"Próximo slide →"}
nx.onclick=()=>go(cur==S.length-1?0:cur+1);pv.onclick=()=>go(cur-1);
bars.onclick=e=>{if(e.target.dataset.i)go(+e.target.dataset.i)};
addEventListener("keydown",e=>{if(e.key=="ArrowRight")go(cur+1);if(e.key=="ArrowLeft")go(cur-1)});
let x0=0,y0=0,sk=0;app.addEventListener("touchstart",e=>{sk=!!e.target.closest(".dk");x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
app.addEventListener("touchend",e=>{if(sk)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1))},{passive:true});
function showT(g,i){const t=TB[g][i];$("pn-"+g).innerHTML=`<h3>${t[0]}</h3><em>${t[1]}</em><p>${t[2]}</p>`;document.querySelectorAll(`[data-g=${g}] button`).forEach((b,j)=>b.setAttribute("aria-selected",j==i))}
document.querySelectorAll(".chips").forEach(c=>{showT(c.dataset.g,0);c.onclick=e=>{const b=e.target.closest("button");if(b)showT(c.dataset.g,+b.dataset.i)}});
let deck,gi,pts,streak,best,res,miss;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const dots=()=>`<div class="dt">${deck.map((_,i)=>`<i class="${res[i]===undefined?(i==gi?"cur":""):res[i]?"ok":"no"}"></i>`).join("")}</div>`;
const head=()=>`<div class="gh"><span>Situação ${Math.min(gi+1,deck.length)}/${deck.length}</span><span class="sk">${streak>1?"Sequência ×"+streak:""}</span></div>${dots()}`;
function start(){deck=shuf(G);gi=pts=streak=best=0;res=[];miss=[];card()}
function card(){const el=$("gm");if(gi>=deck.length)return fim();const q=deck[gi];
el.innerHTML=`${head()}<div class="dk"><div class="cx c2"></div><div class="cx c1"></div><div class="cd2${gi==0?" hint":""}" id="cd"><span class="stp l">Não é</span><span class="stp r">Abusivo</span><p>${q[0]}</p><em>${gi==0?"arraste a carta ou toque nos botões":""}</em></div></div><div class="ab"><button data-a="0">← Não é</button><button data-a="1">É abusivo →</button></div>`;
const c=$("cd");let sx=0,dx=0,on=0;
c.onpointerdown=e=>{on=1;sx=e.clientX;c.classList.remove("hint");c.style.animation="none";c.style.transition="none";try{c.setPointerCapture(e.pointerId)}catch(x){}};
c.onpointermove=e=>{if(!on)return;dx=e.clientX-sx;c.style.transform=`translateX(${dx}px) rotate(${dx/16}deg)`;c.classList.toggle("L",dx<-30);c.classList.toggle("R",dx>30)};
c.onpointerup=c.onpointercancel=()=>{if(!on)return;on=0;c.style.transition="";if(Math.abs(dx)>90)ans(dx>0?1:0,q);else{c.style.transform="";c.classList.remove("L","R")}dx=0};
el.querySelectorAll(".ab button").forEach(b=>b.onclick=()=>ans(+b.dataset.a,q))}
function ans(a,q){const c=$("cd");if(!c||c.dataset.done)return;c.dataset.done=1;const ok=a==q[1],d=a?1:-1;
document.querySelectorAll(".ab button").forEach(x=>x.disabled=true);
c.classList.toggle("R",!!a);c.classList.toggle("L",!a);c.style.transition="transform .45s ease,opacity .45s";c.style.transform=`translateX(${d*440}px) rotate(${d*26}deg)`;c.style.opacity=0;
res[gi]=ok;if(ok){pts++;streak++;best=Math.max(best,streak);vib(20)}else{streak=0;miss.push(q);vib([40,60,40])}
setTimeout(()=>fbk(q,ok),400)}
function burst(box,n){const cs=["#6d28d9","#c9a8ff","#8b5cf6","#fbf3e4","#4c1d95"];for(let i=0;i<n;i++){const e=document.createElement("i");e.className="cp";e.style.cssText=`--c:${cs[i%5]};--x:${(Math.random()-.5)*300}px;--y:${Math.random()*220-20}px;--r:${Math.random()*540}deg`;box.appendChild(e);setTimeout(()=>e.remove(),1000)}}
function fbk(q,ok){const el=$("gm");
el.innerHTML=`${head()}<div class="fbk ${ok?"ok":"no"}" id="fk"><div class="stamp" style="--sc:${q[1]?"#be123c":"#15803d"}">${q[1]?"Abusivo":"Não é abusivo"}<small>${q[2]}</small></div><b class="vd">${ok?"Isso mesmo.":"Atenção: muita gente erra esta, os sinais são sutis mesmo."}</b><p>${q[3]}</p>${ok&&streak>1?`<span class="chip">Sequência ×${streak}</span>`:""}<button class="bt" id="nq">${gi==deck.length-1?"Ver resultado":"Próxima situação"}</button></div>`;
if(ok)burst($("fk"),22);$("nq").onclick=()=>{gi++;card()};$("fk").scrollIntoView({block:"nearest",inline:"nearest"})}
function fim(){const el=$("gm"),n=deck.length;
const tt=pts>=9?"Olhar atento":pts>=6?"Bom olhar":"Sinais sutis";
const m=pts>=9?"Reconhecer sinais cedo faz diferença, para você e para quem você acolhe.":pts>=6?"Você reconhece boa parte dos sinais. Alguns são mais sutis, e é por isso que tanta gente demora a nomeá-los.":"Muitos sinais se disfarçam de cuidado ou de amor. Não é falha sua: a cultura nos ensina a normalizá-los.";
el.innerHTML=`${head()}<div class="fbk" id="fk"><div class="stamp" style="--sc:#6d28d9">${tt}</div><div class="score" id="scr">0/${n}</div><p>${m}</p><span class="chip">Melhor sequência ×${best}</span><div style="margin-top:6px"><button class="bt" id="rs">Jogar de novo</button> ${miss.length?`<button class="bt" id="rv" style="margin-top:8px">Rever o que errei (${miss.length})</button>`:""}</div><div id="rl"></div><small style="color:#1a0b2e">Se algo soou familiar, converse com alguém de confiança ou ligue 180.</small></div>`;
let k=0;const t=setInterval(()=>{$("scr").textContent=k+"/"+n;if(k++>=pts)clearInterval(t)},90);
if(pts>=6)burst($("fk"),26);
$("rs").onclick=start;
if($("rv"))$("rv").onclick=()=>{$("rl").innerHTML=miss.map(q=>`<div class="rvi"><b>${q[2]}</b>${q[3]}</div>`).join("");$("rv").remove()}}
start();go(0);
</script></body></html>
